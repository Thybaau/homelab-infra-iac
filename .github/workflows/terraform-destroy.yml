name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Tapez "DESTROY" pour confirmer la destruction'
        required: true
        type: string

permissions:
  contents: read

env:
  TF_VAR_proxmox_api_url: ${{ secrets.PM_API_URL }}
  TF_VAR_proxmox_api_token_id: ${{ secrets.PM_API_TOKEN_ID }}
  TF_VAR_proxmox_api_token_secret: ${{ secrets.PM_API_TOKEN_SECRET }}
  TF_VAR_vm_password: ${{ secrets.VM_PASSWORD }}

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: self-hosted # OBLIGATOIRE: Proxmox n'est pas accessible depuis Internet

    steps:
      - name: Validate Confirmation
        run: |
          if [ "${{ inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "❌ Confirmation invalide. Destruction annulée."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.0

      - name: Set SSH Keys
        run: |
          # Convertir la variable multi-lignes en format JSON liste pour Terraform
          echo 'TF_VAR_ssh_public_keys<<EOF' >> $GITHUB_ENV
          echo "${{ vars.SSH_PUBLIC_KEYS }}" | jq -R -s -c 'split("\n") | map(select(length > 0))' >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV

      - name: Verify State Exists
        run: |
          if [ ! -f "/var/lib/terraform/states/homelab-infra.tfstate" ]; then
            echo "❌ Aucun state trouvé. Rien à détruire."
            exit 1
          fi
          echo "✅ State trouvé, préparation de la destruction..."

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve

      - name: Backup State Before Deletion
        if: always()
        run: |
          BACKUP_DIR="/var/lib/terraform/backups"
          STATE_FILE="/var/lib/terraform/states/homelab-infra.tfstate"
          mkdir -p "$BACKUP_DIR"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          if [ -f "$STATE_FILE" ]; then
            cp "$STATE_FILE" \
               "$BACKUP_DIR/terraform.tfstate.destroyed.$TIMESTAMP" || true
            echo "✅ State sauvegardé avant suppression"
          fi

      - name: Confirm Destruction
        run: |
          echo "### 🗑️ Infrastructure détruite avec succès"
          echo "Toutes les VMs ont été supprimées de Proxmox."
          echo ""
          echo "⚠️  Le state file a été conservé dans les backups au cas où."

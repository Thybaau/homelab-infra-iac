name: Terraform Plan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**.tf"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  pull-requests: write

env:
  TF_VAR_proxmox_api_url: ${{ secrets.PM_API_URL }}
  TF_VAR_proxmox_api_token_id: ${{ secrets.PM_API_TOKEN_ID }}
  TF_VAR_proxmox_api_token_secret: ${{ secrets.PM_API_TOKEN_SECRET }}
  TF_VAR_vm_password: ${{ secrets.VM_PASSWORD }}

jobs:
  plan:
    name: Terraform Plan
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.5.0

      - name: Set SSH Keys
        run: |
          # Convertir la variable multi-lignes en format JSON liste pour Terraform
          echo 'TF_VAR_ssh_public_keys<<EOF' >> $GITHUB_ENV
          echo "${{ vars.SSH_PUBLIC_KEYS }}" | jq -R -s -c 'split("\n") | map(select(length > 0))' >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const plan = `${{ steps.plan.outputs.stdout }}`;
            // Masquer les valeurs potentiellement sensibles
            const sanitized = plan
              .replace(/("?password"?\s*[:=]\s*)"[^"]*"/gi, '$1"***"')
              .replace(/("?secret"?\s*[:=]\s*)"[^"]*"/gi, '$1"***"')
              .replace(/("?token"?\s*[:=]\s*)"[^"]*"/gi, '$1"***"');
            const truncated = sanitized.length > 60000
              ? sanitized.substring(0, 60000) + '\n...(tronqué)'
              : sanitized;

            const output = `#### Terraform Plan 📋

            **Status**: ${{ steps.plan.outcome }}

            \`\`\`
            ${truncated}
            \`\`\`

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Fail if Plan Failed
        if: steps.plan.outcome == 'failure'
        run: |
          echo "❌ Terraform Plan a échoué. Vérifiez les logs ci-dessus."
          exit 1

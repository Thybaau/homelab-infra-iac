name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VAR_proxmox_api_url: ${{ secrets.PM_API_URL }}
  TF_VAR_proxmox_api_token_id: ${{ secrets.PM_API_TOKEN_ID }}
  TF_VAR_proxmox_api_token_secret: ${{ secrets.PM_API_TOKEN_SECRET }}
  TF_VAR_vm_password: ${{ secrets.VM_PASSWORD }}

jobs:
  apply:
    name: Terraform Apply
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.5.0

      - name: Set SSH Keys
        run: |
          # Convertir la variable multi-lignes en format JSON liste pour Terraform
          echo 'TF_VAR_ssh_public_keys<<EOF' >> $GITHUB_ENV
          echo "${{ vars.SSH_PUBLIC_KEYS }}" | jq -R -s -c 'split("\n") | map(select(length > 0))' >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Backup State File
        if: always()
        run: |
          BACKUP_DIR="/var/lib/terraform/backups"
          STATE_FILE="/var/lib/terraform/states/homelab-infra.tfstate"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          if [ -f "$STATE_FILE" ]; then
            cp "$STATE_FILE" \
               "$BACKUP_DIR/terraform.tfstate.$TIMESTAMP"
            
            # Garder seulement les 10 derniers backups
            cd "$BACKUP_DIR"
            ls -t terraform.tfstate.* 2>/dev/null | tail -n +11 | xargs -r rm
            
            echo "✅ State sauvegardé : terraform.tfstate.$TIMESTAMP"
            echo "📊 Backups disponibles :"
            ls -lh terraform.tfstate.* 2>/dev/null || echo "Aucun backup"
          else
            echo "⚠️  Aucun state à sauvegarder"
          fi

      - name: Terraform Output
        id: output
        run: terraform output -json

      - name: Display VMs Info
        run: |
          echo "### 🚀 VMs déployées avec succès!"
          echo ""
          terraform output k3s_ips
          echo ""
          terraform output openclaw_vm

      # ⚠️ State file NON uploadé comme artifact (contient des secrets en clair)
      # Le backup est géré localement sur le runner dans /var/lib/terraform/backups/
